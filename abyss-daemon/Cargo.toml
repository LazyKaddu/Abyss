[package]
name = "abyss-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
abyss-common = { path = "../abyss-common", features = ["user"] }
aya = "0.16"
aya-log = "0.4"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
libc = "0.2"

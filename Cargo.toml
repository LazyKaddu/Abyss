[workspace]
resolver = "2"
members = [
    "abyss-common",
    "abyss-daemon",
    "abyss-cli",
    "kernel-modules/abyss-core",
    "kernel-modules/abyss-tide",
    "kernel-modules/abyss-gaze",
]
default-members = [
    "abyss-common",
    "abyss-daemon",
    "abyss-cli",
]

[profile.dev]
opt-level = 2
panic = "abort"

[profile.release]
opt-level = 3
panic = "abort"
lto = true
[package]
name = "abyss-cli"
version = "0.1.0"
edition = "2024"
default-run = "abyssctl"

[lib]
path = "src/lib.rs"

[[bin]]
name = "abyssctl"
path = "src/main.rs"

[dependencies]
abyss-common = { path = "../abyss-common", features = ["user"] }
aya = "0.16"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
libc = "0.2"
